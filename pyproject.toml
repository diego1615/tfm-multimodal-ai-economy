[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-multimodal-ai-economy"
version = "1.0.0"
description = "Investigación reproducible de IA, automatización y trabajo a partir de web y transcripciones TED"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "seaborn>=0.12,<1", "requests>=2.31,<3", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "nbformat>=5,<6", "nbclient>=0.9,<1", "ipykernel>=6,<8", "nbconvert>=7,<8"]
app = ["streamlit>=1.32,<2"]
audio = ["yt-dlp>=2024.1", "faster-whisper>=1,<2"]

[project.scripts]
ai-economy = "ai_economy.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
